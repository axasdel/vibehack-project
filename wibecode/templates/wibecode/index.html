<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная | Wibecode</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        
        /* Меню */
        .navbar {
            background-color: #333; padding: 15px 20px;
            display: flex; justify-content: center; gap: 20px;
        }
        .navbar a {
            color: white; text-decoration: none; font-size: 16px;
            font-weight: bold; padding: 5px 10px; border-radius: 4px;
        }
        .navbar a:hover { background-color: #555; }

        /* Контент */
        .main-content { text-align: center; padding-top: 50px; }
        .card { 
            background: white; padding: 30px; border-radius: 10px; 
            display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 500px; width: 100%; text-align: left;
        }
        h1 { color: #333; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 16px; }
        
        /* Форма */
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; color: #444; }
        input[type="text"] { 
            width: 100%; padding: 10px; box-sizing: border-box; 
            border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;
        }
        button { 
            padding: 10px 20px; background-color: #28a745; color: white; 
            border: none; border-radius: 5px; cursor: pointer; 
            font-size: 16px; width: 100%; transition: background-color 0.3s;
        }
        button:hover { background-color: #218838; }
        .result { 
            margin-top: 20px; padding: 15px; background: #e9ecef; 
            border-left: 5px solid #007bff; border-radius: 5px; 
        }
    </style>
</head>
<body>

    <!-- Верхнее меню -->
        <div class="navbar">
        <a href="{% url 'wibecode:index' %}">Главная</a>
        <a href="{% url 'wibecode:about' %}">О нас</a>
        <a href="{% url 'wibecode:choice' %}">Выбор</a>
    </div>

    <div class="main-content">
        <div class="card">
            <h1>Привет из Wibecode! 🚀</h1>
            <p class="subtitle">Шаблоны успешно подключены, можно верстать красоту.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="message">Ваше сообщение:</label>
                    <input type="text" id="message" name="message" placeholder="Введите текст..." value="{{ user_message|default:'' }}" required>
                </div>
                <button type="submit">Отправить</button>
            </form>

            {% if response_text %}
                <div class="result">
                    <strong>Ответ сервера:</strong> {{ response_text }}
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
