<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор | Wibecode</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        
        /* Меню */
        .navbar {
            background-color: #333; padding: 15px 20px;
            display: flex; justify-content: center; gap: 20px;
        }
        .navbar a {
            color: white; text-decoration: none; font-size: 16px;
            font-weight: bold; padding: 5px 10px; border-radius: 4px;
        }
        .navbar a:hover { background-color: #555; }

        /* Контент */
        .main-content { text-align: center; padding-top: 50px; }
        .card { 
            background: white; padding: 30px; border-radius: 10px; 
            display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 500px; width: 100%; text-align: left;
        }
        h1 { color: #333; text-align: center; margin-bottom: 25px; }
        
        /* Стили для формы */
        .radio-group { margin-bottom: 25px; }
        .radio-group label { 
            display: block; font-size: 18px; color: #444; 
            margin-bottom: 12px; cursor: pointer;
        }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        
        button { 
            padding: 12px 20px; background-color: #28a745; color: white; 
            border: none; border-radius: 5px; cursor: pointer; 
            font-size: 16px; width: 100%; transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        
        /* Блок ответа */
        .result { 
            margin-top: 25px; padding: 15px; background: #e9ecef; 
            border-left: 5px solid #007bff; border-radius: 5px; 
            font-size: 18px; color: #333; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Верхнее меню -->
    <div class="navbar">
        <a href="{% url 'wibecode:index' %}">Главная</a>
        <a href="{% url 'wibecode:about' %}">О нас</a>
        <a href="{% url 'wibecode:choice' %}">Выбор</a> <!-- Ссылка на новую страницу -->
    </div>

    <div class="main-content">
        <div class="card">
            <h1>Сделайте ваш выбор</h1>
            
            <form method="post">
                {% csrf_token %}
                <div class="radio-group">
                    <label>
                        <input type="radio" name="user_choice" value="1" required> Вариант 1 (Перезвоните мне)
                    </label>
                    <label>
                        <input type="radio" name="user_choice" value="2"> Вариант 2 (Хочу сотрудничать)
                    </label>
                    <label>
                        <input type="radio" name="user_choice" value="3"> Вариант 3 (Просто зашел)
                    </label>
                </div>
                
                <button type="submit">ОК</button>
            </form>

            <!-- Вывод результата на этой же странице -->
            {% if result_text %}
                <div class="result">
                    {{ result_text }}
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
