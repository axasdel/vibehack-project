            max-width: 500px; width: 100%; text-align: left;
        }
        h1 { color: #333; text-align: center; margin-bottom: 5px; }

<body>

    <!-- Верхнее меню -->
        <div class="navbar">

    </div>

    <div class="main-content">
        <div class="card">
            <h1>Добро пожаловать! 👋</h1>

                <p>Мы рады видеть вас на нашем сайте. Здесь вы можете делиться мыслями и получать мгновенные ответы. Наша команда создала Wibecode, чтобы сделать ваше общение максимально простым, удобным и приятным.</p>
